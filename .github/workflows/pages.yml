name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build demos, and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required pages exist
        run: |
          test -f index.html
          test -f marshall-solutions.html
          test -f robots.txt
          test -f styles.css
          test -f services/it-support.html
          test -f services/backup-disaster-recovery.html
          test -f services/servers-networks.html
          test -f services/cloud-migration.html
          test -f services/essential-website.html
          test -f services/booking-portal.html
          test -f services/wix-migration.html
          test -f case-studies/beemarshall.html
          test -f case-studies/home-care-ops.html
          test -f tools/hosting-cost-compare.html
          test -f BingSiteAuth.xml
          test -f CNAME
          grep -q 'gbtech.co.nz' CNAME
          test -f demoplan/local-seo-entity-checklist.md

      - name: Verify SEO meta tags on each page
        run: |
          pages="index.html
            services/it-support.html services/backup-disaster-recovery.html
            services/servers-networks.html services/cloud-migration.html
            services/essential-website.html services/booking-portal.html
            services/wix-migration.html
            case-studies/beemarshall.html case-studies/home-care-ops.html
            tools/hosting-cost-compare.html"
          for page in $pages; do
            grep -q '<title>' "$page"
            grep -q 'name="description"' "$page"
            grep -q 'name="robots"' "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'og:title' "$page"
            grep -q 'twitter:card' "$page"
            grep -q 'application/ld+json' "$page"
          done
          # Legacy URL stub (noindex redirect to homepage packages)
          test -f marshall-solutions.html
          grep -q 'noindex' marshall-solutions.html
          grep -q 'rel="canonical"' marshall-solutions.html
          grep -q '#packages' marshall-solutions.html

      - name: Verify robots.txt allows marketing and blocks demos
        run: |
          grep -q 'Sitemap: https://gbtech.co.nz/sitemap.xml' robots.txt
          grep -q 'Allow: /services/' robots.txt
          grep -q 'Allow: /case-studies/' robots.txt
          grep -q 'Allow: /tools/' robots.txt
          grep -q 'Disallow: /sim/' robots.txt
          grep -q 'Disallow: /sim-demos/' robots.txt
          grep -q 'Disallow: /demo/' robots.txt
          grep -q 'Disallow: /staff-demo/' robots.txt
          grep -q 'Disallow: /booking-demo/' robots.txt
          grep -q 'Disallow: /staff-demo-app/' robots.txt
          grep -q 'Allow: /' robots.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim-demos/package-lock.json

      - name: Build simulated booking demos
        working-directory: sim-demos
        run: |
          npm ci
          npm run build
          mkdir -p ../sim
          cp -r dist/. ../sim/
          # SPA fallbacks for GitHub Pages deep links
          for d in yacht/coastal yacht/adventure taxi/mohua taxi/bayhop handyman/bayfix handyman/tradeboard pruning/canopy pruning/orchard painting painting/freshcoat painting/paintboard fitness/studioflow fitness/classboard riding/shoreride riding/yardboard; do
            mkdir -p "../sim/$d"
            cp ../sim/index.html "../sim/$d/index.html"
          done
          cp ../sim/index.html ../sim/404.html

      - name: Build Advanced stack showcase (public)
        working-directory: booking-demo
        env:
          VITE_SHOWCASE_MODE: 'true'
          VITE_SITE_URL: https://gbtech.co.nz/demo
          VITE_FORM_ENDPOINT: https://example.com/showcase
          VITE_CALENDAR_ID: showcase@group.calendar.google.com
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:static
          mkdir -p ../demo
          cp -r dist/. ../demo/
          for d in about rentals rentals/book contact; do
            mkdir -p "../demo/$d"
            cp ../demo/index.html "../demo/$d/index.html"
          done

      - name: Build Advanced stack showcase (staff)
        working-directory: staff-demo-app
        env:
          VITE_SHOWCASE_MODE: 'true'
        run: |
          npm ci
          npm run build
          rm -rf ../staff-demo
          mkdir -p ../staff-demo
          cp -r dist/. ../staff-demo/
          for d in dashboard imports/bookings renters login; do
            mkdir -p "../staff-demo/$d"
            cp ../staff-demo/index.html "../staff-demo/$d/index.html"
          done

      - name: Regenerate sitemap from static routes
        run: python3 .github/scripts/generate-sitemap.py

      - name: Verify built demo bundles
        run: |
          test -f sim/index.html
          test -f demo/index.html
          test -f staff-demo/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
