name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build demos, and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required pages exist
        run: |
          test -f index.html
          test -f marshall-solutions.html
          test -f robots.txt
          test -f styles.css

      - name: Verify SEO meta tags on each page
        run: |
          for page in index.html marshall-solutions.html; do
            grep -q '<title>' "$page"
            grep -q 'name="description"' "$page"
            grep -q 'name="robots"' "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'og:title' "$page"
            grep -q 'twitter:card' "$page"
            grep -q 'application/ld+json' "$page"
          done

      - name: Verify robots.txt allows marketing and blocks demos
        run: |
          grep -q 'Sitemap: https://agent5479.github.io/GBTech/sitemap.xml' robots.txt
          grep -q 'Disallow: /sim/' robots.txt
          grep -q 'Disallow: /sim-demos/' robots.txt
          grep -q 'Disallow: /staff-demo/' robots.txt
          grep -q 'Allow: /' robots.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sim-demos/package-lock.json

      - name: Build simulated booking demos
        working-directory: sim-demos
        run: |
          npm ci
          npm run build
          mkdir -p ../sim
          cp -r dist/. ../sim/
          # SPA fallbacks for GitHub Pages deep links
          for d in yacht/coastal yacht/adventure taxi/mohua taxi/bayhop handyman/bayfix handyman/tradeboard pruning/canopy pruning/orchard painting/freshcoat painting/paintboard fitness/studioflow fitness/classboard riding/shoreride riding/yardboard; do
            mkdir -p "../sim/$d"
            cp ../sim/index.html "../sim/$d/index.html"
          done
          cp ../sim/index.html ../sim/404.html

      - name: Regenerate sitemap from static routes
        run: python3 .github/scripts/generate-sitemap.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
